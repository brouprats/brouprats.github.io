<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mateu Prats Munar</title>
<meta name="description" content="Mateu Prats Munar. People PPL, photography and visual work. Academic, mathematics at TUM.">
<meta property="og:title" content="Mateu Prats Munar">
<meta property="og:description" content="Mateu Prats Munar. People PPL, photography and visual work. Academic, mathematics at TUM.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://brouprats.github.io/">
<meta property="og:image" content="https://brouprats.github.io/ppl/assets/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* Entrance: a black field with two doors. Single dark look on purpose. */
  :root { --bg: #000; --fg: #fff; --muted: #8a8a8a; --dim: #5f5f5f; --line: #3a3a3a; --light: #ecebe6; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .page {
    min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (min-width: 900px) { .page { padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); } }
  .bar { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .02em; color: var(--muted); }
  .bar.low { font-size: 12px; color: var(--dim); }
  .doors { display: flex; flex-wrap: wrap; gap: clamp(16px, 2vw, 28px); justify-content: center; }
  .door {
    position: relative; overflow: hidden; flex: 1 1 260px; max-width: 340px; aspect-ratio: 4 / 3;
    display: flex; flex-direction: column; justify-content: space-between; padding: 22px;
    border: 1px solid var(--line); color: var(--fg); text-decoration: none;
    transition: background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .door .top, .door .bottom { position: relative; display: flex; }
  .door .top { justify-content: space-between; font-size: 13px; letter-spacing: .06em; }
  .door .bottom { flex-direction: column; gap: 6px; }
  .door .title { font-size: clamp(30px, 2.8vw, 40px); font-weight: 500; letter-spacing: -.03em; line-height: .95; }
  .door .sub { font-size: 14px; opacity: .75; }
  .door .arrow { transition: transform .35s ease; }
  .door:hover .arrow, .door:focus-visible .arrow { transform: translate(3px, -3px); }
  .door img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity .5s ease, transform 1.2s ease; }
  .door .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%); opacity: 0; transition: opacity .5s ease; }
  .ppl:hover, .ppl:focus-visible { border-color: var(--fg); }
  .ppl:hover img, .ppl:focus-visible img { opacity: 1; transform: scale(1); }
  .ppl:hover .shade, .ppl:focus-visible .shade { opacity: 1; }
  /* no hover on touch screens: show the photo permanently */
  @media (hover: none) { .ppl img, .ppl .shade { opacity: 1; } .ppl img { transform: none; } }
  .acad:hover, .acad:focus-visible { background: var(--light); color: #000; border-color: var(--light); }
  .door:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  /* entrance animation: a hairline grows, then the two doors open from it */
  .doors { position: relative; }
  .intro-line { position: absolute; left: 50%; top: 50%; width: min(100%, 708px); height: 1px; background: var(--fg); opacity: 0; transform: translate(-50%, -50%) scaleX(0); pointer-events: none; }
  html.intro .intro-line { animation: line .75s cubic-bezier(.7, 0, .2, 1) .15s both, gone .35s ease 1.15s forwards; }
  html.intro .door { animation: open .8s cubic-bezier(.7, 0, .2, 1) .75s both; }
  html.intro .acad { animation-delay: .85s; }
  html.intro .door .top { animation: up .6s cubic-bezier(.2, .7, .1, 1) 1.35s both; }
  html.intro .door .bottom { animation: up .7s cubic-bezier(.2, .7, .1, 1) 1.45s both; }
  html.intro .bar { animation: fade .7s ease 1.6s both; }
  @keyframes line { from { opacity: 1; transform: translate(-50%, -50%) scaleX(0); } to { opacity: 1; transform: translate(-50%, -50%) scaleX(1); } }
  @keyframes gone { from { opacity: 1; transform: translate(-50%, -50%) scaleX(1); } to { opacity: 0; transform: translate(-50%, -50%) scaleX(1); } }
  @keyframes open { from { clip-path: inset(50% 0 50% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  /* leaving through a door: a veil in the section's colour grows out of the door and fills the screen */
  .veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; }
  /* the stamped mark: this rule is repeated word for word in ppl/assets/ppl.css, keep them identical */
  .stamp { position: fixed; left: 50vw; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; overflow: visible; pointer-events: none; }
  @media (max-width: 480px) { .stamp { width: 96px; height: 96px; margin: -48px 0 0 -48px; } }
  .stamp.drawing path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .veil-title { position: fixed; z-index: 21; margin: 0; font-size: clamp(30px, 2.8vw, 40px); font-weight: 500; letter-spacing: -.03em; line-height: .95; transform-origin: 0 0; pointer-events: none; white-space: nowrap; }
  /* coming back from a section */
  html.back .page { animation: fade .5s ease both; }
  html.back .door { animation: open .6s cubic-bezier(.7, 0, .2, 1) both; }
  @media (prefers-reduced-motion: reduce) { .door, .door * { transition: none !important; } }
</style>
<script>
  /* play the entrance once per visit; skipped with reduced motion */
  try {
    var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!calm && sessionStorage.getItem('mpm-enter') === 'back') document.documentElement.classList.add('back');
    else if (!calm && !sessionStorage.getItem('mpm-intro')) document.documentElement.classList.add('intro');
    sessionStorage.setItem('mpm-intro', '1');
    sessionStorage.removeItem('mpm-enter');
  } catch (e) {}
</script>
</head>
<body>
<div class="page">
  <div class="bar"><span>Mateu Prats Munar</span><span>Munich · Mallorca</span></div>

  <nav class="doors" aria-label="Choose a section">
    <span class="intro-line" aria-hidden="true"></span>
    <a class="door ppl" href="ppl/">
      <img src="assets/landing-ppl.webp" alt="" width="1200" height="900">
      <span class="shade"></span>
      <span class="top"><span>01</span><span class="arrow" aria-hidden="true">↗</span></span>
      <span class="bottom"><span class="title">People PPL</span><span class="sub">Photography &amp; visual work</span></span>
    </a>
    <a class="door acad" href="academic/">
      <span class="top"><span>02</span><span class="arrow" aria-hidden="true">↗</span></span>
      <span class="bottom"><span class="title">Academic</span><span class="sub">Mathematics · M.Sc. at TUM</span></span>
    </a>
  </nav>

  <div class="bar low"><span>© 2026</span><span>Select an entrance</span></div>
</div>
<script>
  (function () {
    var root = document.documentElement;
    if (root.classList.contains('back')) setTimeout(function () { root.classList.remove('back'); }, 900);
    if (!root.classList.contains('intro')) return;
    var end = function () { root.classList.remove('intro'); };
    var timer = setTimeout(end, 2400);
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
      addEventListener(ev, function () { clearTimeout(timer); end(); }, { once: true, passive: true });
    });
  })();
</script>
<script>
  /* door transitions: People PPL stamps its logo on paper, Academic inverts to its page colour */
  (function () {
    var EASE = 'cubic-bezier(.7, 0, .2, 1)';
    var MARK = '<svg class="stamp drawing" viewBox="0 0 590 591" preserveAspectRatio="none" fill="none" aria-hidden="true">' +
      '<path pathLength="1" d="M5 586H585V5H5V586Z" stroke-width="10" stroke="#25241F"/>' +
      '<path pathLength="1" d="M173.5 503.36V329.36M173.5 329.36V136.5H332C363.5 136.5 417.389 158.544 418.5 234.36C419.611 310.175 362.5 329.36 332 329.36H173.5Z" stroke-width="100" stroke="#25241F"/>' +
      '<path pathLength="1" d="M173.5 503.36V329.36M173.5 329.36V136.5H332C363.5 136.5 417.389 158.544 418.5 234.36C419.611 310.175 362.5 329.36 332 329.36H173.5Z" stroke-width="10" stroke="#F3F3F3"/></svg>';
    var busy = false;
    function inset(r) { return 'inset(' + r.top + 'px ' + (innerWidth - r.right) + 'px ' + (innerHeight - r.bottom) + 'px ' + r.left + 'px)'; }
    function leave(a, kind, e) {
      if (busy || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || !document.body.animate) return;
      e.preventDefault(); busy = true;
      try { sessionStorage.setItem('mpm-enter', kind); } catch (x) {}
      var go = function () { location.href = a.href; };
      var r = a.getBoundingClientRect();
      var veil = document.createElement('div'); veil.className = 'veil';
      document.body.appendChild(veil);
      if (kind === 'ppl') {
        veil.style.background = '#f0ece1';
        veil.innerHTML = MARK;
        veil.animate([{ clipPath: inset(r), opacity: 0 }, { clipPath: inset(r), opacity: 1, offset: .18 }, { clipPath: 'inset(0px)', opacity: 1 }], { duration: 620, easing: EASE, fill: 'both' });
        var p = veil.querySelectorAll('path'), draw = function (el, d, t) { return el.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: t, delay: d, easing: 'cubic-bezier(.5, 0, .2, 1)', fill: 'both' }); };
        draw(p[0], 300, 480); draw(p[1], 520, 480);
        draw(p[2], 640, 420).onfinish = function () {
          /* drop the dash trick so the finished mark is a plain stroke, exactly as the next page draws it */
          veil.querySelector('svg').classList.remove('drawing');
          p.forEach(function (el) { el.getAnimations().forEach(function (an) { an.cancel(); }); });
          setTimeout(go, 120);
        };
      } else {
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        var bg = dark ? '#0f0f0f' : '#ffffff', fg = dark ? '#f1f1ef' : '#111111';
        var t = a.querySelector('.title'), tr = t.getBoundingClientRect();
        var ghost = document.createElement('p'); ghost.className = 'veil-title'; ghost.textContent = t.textContent;
        ghost.style.cssText = 'left:' + tr.left + 'px;top:' + tr.top + 'px;color:' + fg;
        document.body.appendChild(ghost);
        var gut = innerWidth >= 900 ? 48 : 16;
        veil.animate([{ clipPath: inset(r), background: dark ? '#000000' : '#ecebe6' }, { clipPath: 'inset(0px)', background: bg }], { duration: 620, easing: EASE, fill: 'both' });
        ghost.animate([{ transform: 'none', opacity: 1 }, { opacity: 1, offset: .55 }, { transform: 'translate(' + (gut - tr.left) + 'px,' + (24 - tr.top) + 'px) scale(.4)', opacity: 0 }], { duration: 620, easing: EASE, fill: 'both' }).onfinish = go;
      }
    }
    [['.ppl', 'ppl'], ['.acad', 'acad']].forEach(function (d) {
      var a = document.querySelector(d[0]);
      a.addEventListener('click', function (e) { leave(a, d[1], e); });
      /* fetch the section early so the page is ready when the veil closes */
      var warm = function () { var l = document.createElement('link'); l.rel = 'prefetch'; l.href = a.href; document.head.appendChild(l); };
      ['pointerenter', 'touchstart', 'focus'].forEach(function (ev) { a.addEventListener(ev, warm, { once: true, passive: true }); });
    });
    /* back button restores this page from cache: clear whatever the last exit left on screen */
    addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      busy = false;
      document.querySelectorAll('.veil, .veil-title').forEach(function (n) { n.remove(); });
    });
  })();
</script>
</body>
</html>
