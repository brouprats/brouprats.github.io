<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People PPL</title>
<meta name="description" content="People PPL, a visual journal. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg: #000; --fg: #fff; --muted: #8a8a8a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .page {
    min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .mark { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .mark svg { width: 72px; height: 72px; }
  .word { display: flex; flex-direction: column; line-height: .95; }
  .word b { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .word span { font-size: 13px; font-weight: 500; letter-spacing: .08em; align-self: flex-end; }
  .soon { color: var(--muted); font-size: 14px; text-align: center; }
  a { color: var(--fg); font-size: 14px; }
  a:hover { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <a href="../">← Entrance</a>
  <div class="mark">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="3" y="3" width="94" height="94" fill="none" stroke="#fff" stroke-width="4"></rect>
      <path d="M32 82 V20 H56 a19 19 0 0 1 0 38 H32" fill="none" stroke="#fff" stroke-width="12"></path>
      <path d="M32 82 V20 H56 a19 19 0 0 1 0 38 H32" fill="none" stroke="#000" stroke-width="2"></path>
    </svg>
    <div class="word"><b>People</b><span>PPL</span></div>
    <p class="soon">A visual journal. Iceland, Japan and China, coming soon.</p>
  </div>
  <span></span>
</div>
</body>
</html>
